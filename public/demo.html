<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget embed demo</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.6 system-ui, sans-serif;
        background: #f4f2ef;
        color: #1a1a1a;
      }
      .wrap { max-width: 640px; margin: 0 auto; padding: 80px 24px; }
      h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0 0 8px; }
      p.lede { color: #666; margin: 0 0 40px; }
      .note {
        border-left: 3px solid #e8482f;
        padding: 12px 16px;
        background: #fff;
        font-size: 14px;
      }
      code { background: #e8e5e0; padding: 2px 5px; border-radius: 3px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Living Canvas Tattoo</h1>
      <p class="lede">
        A stand-in for the studio's real website, so the widget can be seen the way a
        client sees it.
      </p>
      <div class="note">
        The chat bubble in the bottom right is the whole integration — one script tag,
        pasted into the studio's site:<br /><br />
        <code>&lt;script src="/widget.js" data-studio="your-slug"&gt;&lt;/script&gt;</code>
      </div>
    </div>

    <script src="/widget.js" data-studio="living-canvas-tattoo-nxst"></script>
  </body>
</html>
