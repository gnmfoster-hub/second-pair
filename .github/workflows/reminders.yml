name: Send due reminders

# Vercel's Hobby plan allows one cron run a day, which is not a schedule for
# something that has to send a reminder at the right hour. GitHub Actions runs
# this every fifteen minutes for nothing, against the same endpoint.
#
# Calling it twice is safe by design: a reminder moves off `pending` the moment
# it is handled, so the Vercel daily run and this one cannot double-send.
#
# GitHub's scheduler is best-effort and can run several minutes late under load.
# That is fine here — a reminder is due within a window, not to the second.

on:
  schedule:
    - cron: "*/15 * * * *"
  # So it can be run by hand from the Actions tab when something looks stuck.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminders endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set in this repository's secrets."
            exit 1
          fi

          # --fail-with-body so a 401 or a 503 fails the run loudly rather than
          # succeeding quietly, which is how nobody notices reminders stopped.
          curl --silent --show-error --fail-with-body \
               --max-time 120 \
               --header "Authorization: Bearer $CRON_SECRET" \
               "$SITE_URL/api/cron/reminders"
