name: Send due reminders

# Vercel's Hobby plan allows one cron run a day, which is not a schedule for
# something that has to send a reminder at the right hour. GitHub Actions runs
# this every five minutes for nothing, against the same endpoint.
#
# Five rather than fifteen since first refusal arrived: when the assistant
# stands back to let the owner answer first, this sweep is what picks the
# enquiry up afterwards. A five-minute head start released on a fifteen-minute
# sweep is a twenty-minute wait, which is not what was promised to the customer
# or the owner. Five minutes is GitHub's floor.
#
# Calling it twice is safe by design: a reminder moves off `pending` the moment
# it is handled, so the Vercel daily run and this one cannot double-send.
#
# GitHub's scheduler is best-effort and can run several minutes late under load.
# A reminder is due within a window rather than to the second, and a held
# enquiry answered a few minutes late is still answered — but it is why the
# head start is described to owners as "about five minutes" rather than exactly
# five, because promising a number this cannot keep would be a lie.

on:
  schedule:
    - cron: "*/5 * * * *"
  # So it can be run by hand from the Actions tab when something looks stuck.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # Nothing to do until the secrets exist, and that is not a failure.
      #
      # This used to exit 1 when they were missing, which meant a repository
      # that had simply not been set up yet emailed its owner a failure every
      # fifteen minutes. Loud when something is broken is right; loud about a
      # step somebody has not got to yet is just noise, and noise is how real
      # failures stop being read.
      - name: Are the secrets set?
        id: configured
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: SITE_URL and CRON_SECRET are not set in this"
            echo "repository's secrets yet, so there is nothing to call."
            echo "Settings -> Secrets and variables -> Actions."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # From here a failure is a real one: the secrets exist, so either the app
      # is down, the secret does not match, or CRON_SECRET is missing in Vercel.
      - name: Call the reminders endpoint
        if: steps.configured.outputs.ready == 'yes'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
               --max-time 120 \
               --header "Authorization: Bearer $CRON_SECRET" \
               "$SITE_URL/api/cron/reminders"
